# Manual deploy button (Actions tab -> Run workflow). This is the ONLY thing
# that changes what runs on the VMs - pushes just build the image to GHCR.
#
# Both modes pull the latest image, then:
#   soft - stop running user servers so they re-spawn on the new image.
#          Briefly kicks live sessions, keeps all user data.
#   hard - also delete every user volume, re-seeding notebooks from the new
#          image on next login. PERMANENTLY erases user notebooks and edits.
name: Hub reset

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "soft = new image, keep data. hard = new image, WIPE all user data."
        type: choice
        options: [soft, hard]
        default: soft
      target:
        description: "Which hub to reset."
        type: choice
        options: [both, workshop1, workshop2]
        default: both

jobs:
  reset:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - hub: workshop1
          host: workshop10-1-u78259.vm.elestio.app
        - hub: workshop2
          host: jupyterhub-6genr-u78259.vm.elestio.app
    steps:
    - if: github.event.inputs.target == 'both' || github.event.inputs.target == matrix.hub
      env:
        VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        MODE: ${{ github.event.inputs.mode }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id
        chmod 600 ~/.ssh/id
        ssh-keygen -y -f ~/.ssh/id > /dev/null || { echo "VM_SSH_KEY is not a valid private key"; exit 1; }
        PULL='docker pull ghcr.io/pypsalabs/workshop-202610-notebook:latest'
        STOP='docker ps -aq --filter name=jupyter- | xargs -r docker rm -f'
        WIPE='docker volume ls -q --filter name=^jupyterhub- | xargs -r docker volume rm'
        if [ "$MODE" = "hard" ]; then
          REMOTE="$PULL && $STOP && $WIPE"
        else
          REMOTE="$PULL && $STOP"
        fi
        ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new \
          root@${{ matrix.host }} "$REMOTE"
